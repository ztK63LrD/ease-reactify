<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>
  <script>
    // GitHub Pages SPA 路由解决方案
    // 当用户刷新非根路径时，GitHub Pages 会返回 404
    // 这个脚本会将请求重定向回 index.html，保留路径信息
    (function() {
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      
      // 获取 base 路径
      var base = '/ease-reactify/';
      
      // 如果路径以 base 开头，去掉 base
      if (path.startsWith(base)) {
        path = path.slice(base.length - 1);
      }
      
      // 重定向到 index.html，并保留路径信息
      var redirect = base + '?p=' + encodeURIComponent(path + search + hash);
      window.location.replace(redirect);
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
